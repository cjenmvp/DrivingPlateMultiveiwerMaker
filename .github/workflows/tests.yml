name: Multiviewer tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libopengl0 libxkbcommon0
          python -m pip install PySide6
      - name: Test software rendering and GUI flows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
